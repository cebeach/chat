# Profiles for the llama-server integration tests: one table per model, kept in git so the
# arguments for each model are reviewed like code. See docs/testing.md.
#
# `file` is a GGUF filename inside your models directory (models_dir in
# tests/llama-server.local.toml, or $LLAMA_TEST_MODEL_DIR). The fixture sets -m, --host and
# --port itself.
#
# `args` is a list with one llama-server flag per element, written exactly as you would type
# it to llama-server, with either dash flavor (-ngl 99 or --n-gpu-layers 99). A profile's
# `args` replace any default spelled with the same flag; aliases are not matched.

[defaults]
args = [
    "--jinja",
    "--ctx-size 16384",
    "--n-gpu-layers 99",
    "--no-webui",
    "--flash-attn on",
    "--cache-type-k q8_0",
    "--cache-type-v q8_0",
    "--batch-size 4096",
    "--ubatch-size 1024",
    "--kv-unified",
    "--parallel 1",
    "--log-prefix",
    "--log-verbose",
    "--log-timestamps",
]

[models.qwen35-2B-Q8_0]
# args = [                         # flags for this model only, merged over the defaults
#     "--ctx-size 8192",
# ]
file = "Qwen_Qwen3.5-2B-Q8_0.gguf"
source_url = "https://huggingface.co/bartowski/Qwen_Qwen3.5-2B-GGUF/resolve/main/Qwen_Qwen3.5-2B-Q8_0.gguf"
think_tags = ["<think>", "</think>"]   # observed on the real model; checked by the integration tests
vram_mb = 2153                     # memory this profile uses with its exact args, measured on your GPU

[models.gemma-4-E2B-it-Q8_0]
file = "gemma-4-E2B-it-Q8_0.gguf"
source_url = "https://huggingface.co/ggml-org/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q8_0.gguf"
think_tags = ["<|channel>thought", "<channel|>"]
vram_mb = 2666

[models.gpt-oss-20b-MXFP4]
file = "gpt-oss-20b-MXFP4.gguf"
source_url = "https://huggingface.co/ggml-org/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-MXFP4.gguf"
think_tags = ["<|channel|>analysis<|message|>", "<|end|><|start|>assistant<|channel|>final<|message|>"]
vram_mb = 9667

[models.Ministral-3-3B-Instruct-2512-Q8_0]
file = "Ministral-3-3B-Instruct-2512-Q8_0.gguf"
source_url = "https://huggingface.co/ggml-org/Ministral-3-3B-Instruct-2512-GGUF/resolve/main/Ministral-3-3B-Instruct-2512-Q8_0.gguf"
think_tags = []                    # this model does not think
vram_mb = 4539
